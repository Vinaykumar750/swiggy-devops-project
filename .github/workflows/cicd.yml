
name: Swiggy DevSecOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build React application
      - name: Build React application
        run: npm run build

      # 5. SonarQube code analysis
      - name: SonarQube scan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=swiggy
            
      # Dependency diagnostics (before Trivy filesystem scan)
      - name: Dependency security diagnostics
        run: |
          npm ls react-scripts || true
          npm audit --omit=dev --audit-level=high || true

      # Trivy filesystem scan
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # 7. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t "swiggy:${GITHUB_SHA}" \
            -t "swiggy:latest" .

      # 8. Scan the locally built Docker image
      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: swiggy:${{ github.sha }}
          scan-type: image
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # 9. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # 10. Login to Amazon ECR
      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 11. Tag and push Docker image to ECR
      - name: Push Docker image to Amazon ECR
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: swiggy
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag "swiggy:${IMAGE_TAG}" \
            "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"

          docker tag "swiggy:latest" \
            "${REGISTRY}/${REPOSITORY}:latest"

          docker push "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"
          docker push "${REGISTRY}/${REPOSITORY}:latest"

          
